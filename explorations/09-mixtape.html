<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploration 09/15 · Mixtape — Steven Long Tran</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#221436;--panel:#2E1B4A;--ink:#FCEAFF;--dim:#9B7FB8;--acc:#FF5FA2;--ok:#59E3E3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Space Mono',monospace;display:grid;place-items:center;min-height:100vh;padding:40px 14px}
.deck{width:min(680px,100%);background:var(--panel);border:1px solid #4A2F6E;border-radius:18px;padding:26px;box-shadow:0 40px 90px -40px #000,0 0 80px -30px #FF5FA2}
.lcd{background:#0F0E0B;border:1px solid #4A2F6E;border-radius:10px;padding:18px 20px;margin-bottom:18px}
.lcd .now{color:var(--ok);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.lcd .tt{font-size:19px;font-weight:700;margin:8px 0 4px;min-height:26px}
.lcd .art{color:var(--dim);font-size:12.5px;min-height:20px}
.bar{height:6px;background:#3A2458;border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s linear}
.tr{display:grid;grid-template-columns:30px 1fr auto;gap:14px;align-items:center;padding:11px 10px;border-radius:9px;cursor:pointer;color:var(--dim)}
.tr:hover{background:#3A2458;color:var(--ink)}
.tr.on{color:var(--ink);background:#3A2458}
.tr.on .n{color:var(--acc)}
.tr .len{font-size:12px}
.tr b{font-weight:400}
.tr.on b{font-weight:700}
.ctl{display:flex;gap:10px;justify-content:center;margin:18px 0 8px}
.ctl button{background:none;border:1px solid #4A2F6E;color:var(--ink);border-radius:50%;width:48px;height:48px;font-size:16px;cursor:pointer}
.ctl button:hover{border-color:var(--acc);color:var(--acc)}
.side{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:14px}
.side a{color:var(--acc);text-decoration:none}
.open{display:block;text-align:center;margin-top:10px;color:var(--acc);text-decoration:none;font-size:13px}
.open:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="deck">
 <div class="lcd">
  <div class="now">Now playing · steven long tran · greatest untanglings</div>
  <div class="tt" id="tt">Press play</div>
  <div class="art" id="art">Exploration 09/15 — every project is a track; play one and read along</div>
  <div class="bar"><i id="pb"></i></div>
 </div>
 <div id="list"></div>
 <div class="ctl"><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button></div>
 <a class="open" id="open" href="../index.html" target="_blank">open liner notes →</a>
 <div class="side"><span>Side A: enterprise · Side B: AI-native</span><a href="../index.html">standing site</a></div>
</div>
<script>
var T=[
["A1","One trade-in flow for four systems","T-Mobile · completion +~10%","../case-studies/tmobile-trade-in.html","3:42"],
["A2","The locator that answers before the tap","Western Union · 200+ countries","../case-studies/western-union.html","2:58"],
["A3","Regulated content, still human","Pharma · 16 weeks · renewed twice","../case-studies/rare-disease.html","3:11"],
["B1","Customers who might not be human","T-Mobile API Marketplace · 2025-26","../case-studies/api-marketplace.html","4:20"],
["B2","Planning that shows its consequences","Compas · in progress","../case-studies/compas.html","3:33"],
["B3","Five voices in, one protected theme out","Koé rebuilt · prototype inside","../case-studies/koe-2026.html","3:05"],
["B4","The bike signals the police, not you","FindMyBike rebuilt · prototype inside","../case-studies/findmybike-2026.html","2:47"],
["B5","The site that mixes itself (hidden track)","Rebuild log · with an AI pair","../rebuild-log.html","5:55"]];
var list=document.getElementById('list'),cur=-1,playing=false,prog=0,timer=null;
T.forEach(function(t,i){
 var d=document.createElement('div');d.className='tr';
 d.innerHTML='<span class="n">'+t[0]+'</span><b>'+t[1]+'</b><span class="len">'+t[4]+'</span>';
 d.onclick=function(){load(i);play(true)};
 list.appendChild(d);
});
function load(i){cur=i;prog=0;
 [].forEach.call(list.children,function(c,j){c.classList.toggle('on',j===i)});
 document.getElementById('tt').textContent=T[i][1];
 document.getElementById('art').textContent=T[i][2];
 document.getElementById('open').href=T[i][3];
 document.getElementById('pb').style.width='0%';}
function play(p){playing=p;document.getElementById('play').textContent=p?'⏸':'▶';
 clearInterval(timer);
 if(p)timer=setInterval(function(){prog+=1.2;if(prog>=100){next();return}
  document.getElementById('pb').style.width=prog+'%'},200);}
function next(){load((cur+1)%T.length);play(true)}
document.getElementById('play').onclick=function(){if(cur<0)load(0);play(!playing)};
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=function(){load((cur-1+T.length)%T.length);play(true)};
</script>
<script src="skins.js"></script>
</body>
</html>
